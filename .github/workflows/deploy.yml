name: Deploy React JSX App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5   # ✅ IMPORTANT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # ⚠️ change to ./build if not using Vite

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
